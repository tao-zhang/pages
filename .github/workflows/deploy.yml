name: Deploy

# Deploy-on-publish: every push to main (i.e. every merged post) rebuilds
# the static export and republishes it. Requires GitHub Pages to be enabled
# on the repo with Source = "GitHub Actions" (Settings > Pages) — see
# docs/publishing.md for the one-time setup.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; never cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # No custom domain yet: derive the live GitHub Pages URL (and the
      # basePath Next.js needs for a project-site subpath) from the repo
      # itself, so this keeps working unmodified once a real domain is set
      # as the NEXT_PUBLIC_SITE_URL repo variable (basePath becomes "").
      - name: Determine site URL and base path
        run: |
          if [ -n "${{ vars.NEXT_PUBLIC_SITE_URL }}" ]; then
            echo "SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}" >> "$GITHUB_ENV"
            echo "BASE_PATH=${{ vars.NEXT_PUBLIC_BASE_PATH }}" >> "$GITHUB_ENV"
          else
            OWNER="${{ github.repository_owner }}"
            REPO="${{ github.event.repository.name }}"
            OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
            REPO_LC=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
            if [ "$REPO_LC" = "$OWNER_LC.github.io" ]; then
              echo "SITE_URL=https://$OWNER_LC.github.io" >> "$GITHUB_ENV"
              echo "BASE_PATH=" >> "$GITHUB_ENV"
            else
              echo "SITE_URL=https://$OWNER_LC.github.io/$REPO" >> "$GITHUB_ENV"
              echo "BASE_PATH=/$REPO" >> "$GITHUB_ENV"
            fi
          fi
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ env.BASE_PATH }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.NEXT_PUBLIC_GSC_VERIFICATION }}
          NEXT_PUBLIC_TWITTER_HANDLE: ${{ vars.NEXT_PUBLIC_TWITTER_HANDLE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
